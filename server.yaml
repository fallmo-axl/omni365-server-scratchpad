apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: omni365-server-s3
  namespace: omni365
spec:
  bucketName: omni365-server-s3
  storageClassName: ocs-storagecluster-ceph-rgw
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: omni365-ca-bundle
  namespace: omni365
data:
  10-ca-bundle.sh: |
    #!/bin/sh
    cat /etc/ssl/certs/ca-certificates.crt /etc/omni365-ca/service-ca.crt > /tmp/ca-bundle.crt
  zz-ca-bundle.ini: |
    curl.cainfo = /tmp/ca-bundle.crt
    openssl.cafile = /tmp/ca-bundle.crt
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: omni365-redis-conf
  namespace: omni365
data:
  10-redis-cluster-config.sh: |
    #!/bin/sh
    cat > /var/www/html/config/redis-cluster.config.php <<'PHP'
    <?php
    $CONFIG = [
      'memcache.distributed' => '\OC\Memcache\Redis',
      'memcache.locking' => '\OC\Memcache\Redis',
      'redis.cluster' => [
        'seeds' => ['omni365-server-redis-client:6379'],
        'timeout' => 1.5,
        'read_timeout' => 1.5,
      ],
    ];
    PHP
  zz-redis-cluster.ini: |
    session.save_handler = rediscluster
    session.save_path = "seed[]=omni365-server-redis-client:6379&timeout=2&read_timeout=2"
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: omni365-service-ca
  namespace: omni365
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
---
kind: Secret
apiVersion: v1
metadata:
  name: omni365-server-smtp
stringData:
  HOST: replace
  NAME: replace
  PASSWORD: replace
  PORT: replace
  SECURE: replace
type: Opaque
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: omni365-server
  namespace: omni365
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: ocs-storagecluster-cephfs
  volumeMode: Filesystem
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: omni365-server
  namespace: omni365
  labels:
    app: omni365-server
    app.kubernetes.io/part-of: omni
    app.openshift.io/runtime: php
spec:
  selector:
    matchLabels:
      app: omni365-server
  template:
    metadata:
      labels:
        app: omni365-server
    spec:
      containers:
        - name: omni365-server
          image: quay.io/mohamedf0/omni365-server:v1
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            limits:
              memory: 8Gi
            requests:
              cpu: 100m
              memory: 512Mi
          volumeMounts:
            - name: webroot
              mountPath: /var/www/html
            - name: redis-cluster-config
              mountPath: /docker-entrypoint-hooks.d/before-starting/10-redis-cluster-config.sh
              subPath: 10-redis-cluster-config.sh
            - name: redis-cluster-config
              mountPath: /usr/local/etc/php/conf.d/zz-redis-cluster.ini
              subPath: zz-redis-cluster.ini
            - name: service-ca
              mountPath: /etc/omni365-ca
              readOnly: true
            - name: ca-bundle
              mountPath: /docker-entrypoint-hooks.d/before-starting/10-ca-bundle.sh
              subPath: 10-ca-bundle.sh
            - name: ca-bundle
              mountPath: /usr/local/etc/php/conf.d/zz-ca-bundle.ini
              subPath: zz-ca-bundle.ini
              #
            - name: apache-mpm
              mountPath: /etc/apache2/mods-available/mpm_prefork.conf
              subPath: mpm_prefork.conf
            - name: omni365-cors
              mountPath: /etc/apache2/conf-enabled/omni365-cors.conf
              subPath: omni365-cors.conf

          env:
            ### Reverse proxy ###
            - name: OVERWRITEPROTOCOL
              value: https
            - name: TRUSTED_PROXIES
              value: 10.128.0.0/14 # your cluster's pod network

            ### Fontconfig cache for the non-root user ###
            - name: XDG_CACHE_HOME
              value: /tmp/.cache

            ### Object Storage ###
            - name: OBJECTSTORE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: omni365-server-s3
                  key: BUCKET_NAME
            - name: OBJECTSTORE_S3_HOST
              valueFrom:
                configMapKeyRef:
                  name: omni365-server-s3
                  key: BUCKET_HOST
            - name: OBJECTSTORE_S3_PORT
              valueFrom:
                configMapKeyRef:
                  name: omni365-server-s3
                  key: BUCKET_PORT
            - name: OBJECTSTORE_S3_KEY
              valueFrom:
                secretKeyRef:
                  name: omni365-server-s3
                  key: AWS_ACCESS_KEY_ID
            - name: OBJECTSTORE_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: omni365-server-s3
                  key: AWS_SECRET_ACCESS_KEY
            - name: OBJECTSTORE_S3_REGION
              value: us-east-1
            - name: OBJECTSTORE_S3_USEPATH_STYLE
              value: "true"
            - name: OBJECTSTORE_S3_AUTOCREATE
              value: "false"
            - name: OBJECTSTORE_S3_SSL
              value: "true" # must match BUCKET_PORT: "true" for 443, "false" for 80

            # ### SMTP ###
            # - name: SMTP_HOST
            #   valueFrom:
            #     secretKeyRef:
            #       name: omni365-server-smtp
            #       key: HOST
            # - name: SMTP_PORT
            #   valueFrom:
            #     secretKeyRef:
            #       name: omni365-server-smtp
            #       key: PORT
            # - name: SMTP_NAME
            #   valueFrom:
            #     secretKeyRef:
            #       name: omni365-server-smtp
            #       key: NAME
            # - name: SMTP_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: omni365-server-smtp
            #       key: PASSWORD
            # - name: SMTP_SECURE
            #   valueFrom:
            #     secretKeyRef:
            #       name: omni365-server-smtp
            #       key: SECURE

            ### Database ###
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: omni365-server-postgres-app
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: omni365-server-postgres-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: omni365-server-postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: omni365-server-postgres-app
                  key: password
      volumes:
        - name: webroot
          persistentVolumeClaim:
            claimName: omni365-server
        - name: redis-cluster-config
          configMap:
            name: omni365-redis-conf
            defaultMode: 0555
        - name: service-ca
          configMap:
            name: omni365-service-ca
        - name: ca-bundle
          configMap:
            name: omni365-ca-bundle
            defaultMode: 0555
            #
        - name: apache-mpm
          configMap:
            name: apache-mpm
            defaultMode: 420
        - name: omni365-cors
          configMap:
            name: omni365-cors
            defaultMode: 420
---
kind: Service
apiVersion: v1
metadata:
  name: omni365-server
  namespace: omni365
  labels:
    app: omni365-server
spec:
  selector:
    app: omni365-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: omni365-server
  namespace: omni365
  labels:
    app: omni365-server
  annotations:
    haproxy.router.openshift.io/timeout: 10m
spec:
  host: omniserver.heritage.africa
  to:
    kind: Service
    name: omni365-server
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: omni365-cors
  namespace: omni365
data:
  omni365-cors.conf: |-
    # Allow trusted frontend origins
    SetEnvIf Origin "^https://omni365\.heritage\.africa$" CORS_ORIGIN=$0
    # Production
    SetEnvIf Origin "^https://omni365\.accel-tech\.net$" CORS_ORIGIN=$0

    Header always set Access-Control-Allow-Origin "%{CORS_ORIGIN}e" env=CORS_ORIGIN
    Header always set Access-Control-Allow-Credentials "true" env=CORS_ORIGIN
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, PROPFIND, PROPPATCH, MKCOL, COPY, MOVE, REPORT, SEARCH, LOCK, UNLOCK" env=CORS_ORIGIN
    Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Cache-Control, Depth, Destination, Overwrite, If-Match, If-None-Match, Range, OCS-APIRequest, X-Requested-With, X-OC-Mtime, X-OC-CTime, OC-Chunked, OC-Total-Length, OC-Checksum, X-Chunking-Version, X-Request-ID, Prefer" env=CORS_ORIGIN
    Header always set Access-Control-Expose-Headers "ETag, Content-Length, Content-Range, Content-Disposition, Location, DAV, OC-FileId, OC-ETag, X-Request-ID, X-Chat-Last-Given, X-Chat-Last-Common-Read, X-Activity-Last-Given, X-Activity-First-Known" env=CORS_ORIGIN

    Header always set Access-Control-Max-Age "600" env=CORS_ORIGIN
    Header always merge Vary "Origin"

    # Handle preflight requests
    <If "%{REQUEST_METHOD} == 'OPTIONS' && -n env('CORS_ORIGIN')">
        Redirect 204 /
    </If>

    # Lets the app's download frame receive WebDAV files in Safari, which applies X-Frame-Options even to an attachment
    <LocationMatch "^/remote\.php/dav/">
        Header always add Content-Security-Policy "frame-ancestors 'self' https://omni365.heritage.africa https://omni365.accel-tech.net"
    </LocationMatch>
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: apache-mpm
  namespace: omni365
data:
  mpm_prefork.conf: |
    # prefork MPM
    # StartServers: number of server processes to start
    # MinSpareServers: minimum number of server processes which are kept spare
    # MaxSpareServers: maximum number of server processes which are kept spare
    # MaxRequestWorkers: maximum number of server processes allowed to start
    # MaxConnectionsPerChild: maximum number of requests a server process serves

    ServerLimit             300
    StartServers            25
    MinSpareServers         25
    MaxSpareServers         50
    MaxRequestWorkers       300
    MaxConnectionsPerChild  1000
