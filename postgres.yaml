apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: omni365-server-postgres
  namespace: omni365
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  resources:
    requests:
      cpu: 250m
      memory: 500Mi
    limits:
      cpu: "1"
      memory: 1Gi
  storage:
    size: 20Gi
  walStorage:
    size: 4Gi
